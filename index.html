<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Mobile Dev POC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 1.5rem;
        }

        .container {
            max-width: 48rem;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.25rem;
            color: #475569;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 0.25rem;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World</h1>
        <p>Mobile development POC - Built and deployed from a phone</p>
        <div class="badge">Powered by GitHub Pages</div>
    </div>
</body>
</html>
