<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Deerfield Beach - Surf's Up! 🏄</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Raleway:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: linear-gradient(135deg,
                #00c6ff 0%,
                #0072ff 25%,
                #ff6b9d 50%,
                #ffa047 75%,
                #ffe259 100%);
            background-size: 400% 400%;
            animation: beachGradient 20s ease infinite;
            position: relative;
            touch-action: pan-y;
        }

        @keyframes beachGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated wave overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.06) 0%, transparent 50%);
            pointer-events: none;
            animation: waves 15s ease-in-out infinite;
        }

        @keyframes waves {
            0%, 100% { opacity: 0.5; transform: translateY(0px); }
            50% { opacity: 0.8; transform: translateY(-20px); }
        }

        .carousel-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: none;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.15),
                0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateX(100%) rotateY(20deg) scale(0.8);
            pointer-events: none;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .card.splash {
            justify-content: center;
            padding: 2rem;
        }

        .card.active {
            opacity: 1;
            transform: translateX(0) rotateY(0) scale(1);
            pointer-events: auto;
            z-index: 2;
        }

        .card.prev {
            opacity: 0;
            transform: translateX(-100%) rotateY(-20deg) scale(0.8);
        }

        .card.entering-right {
            animation: slideInRight 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .card.entering-left {
            animation: slideInLeft 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .card.exiting-left {
            animation: slideOutLeft 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .card.exiting-right {
            animation: slideOutRight 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%) rotateY(20deg) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotateY(0) scale(1);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100%) rotateY(-20deg) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotateY(0) scale(1);
            }
        }

        @keyframes slideOutLeft {
            from {
                opacity: 1;
                transform: translateX(0) rotateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(-100%) rotateY(-20deg) scale(0.8);
            }
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0) rotateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(100%) rotateY(20deg) scale(0.8);
            }
        }

        .splash-logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 4rem;
            color: white;
            text-shadow:
                4px 4px 0px rgba(255, 107, 157, 0.8),
                8px 8px 0px rgba(255, 160, 71, 0.6),
                12px 12px 0px rgba(0, 198, 255, 0.4);
            animation: floatText 3s ease-in-out infinite;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .splash-tagline {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 0.5rem;
        }

        .splash-dedication {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 2rem;
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            flex-shrink: 0;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .card-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.5rem;
            color: white;
            margin-bottom: 1rem;
            text-shadow:
                3px 3px 0px rgba(255, 107, 157, 0.6),
                6px 6px 0px rgba(0, 198, 255, 0.4);
            flex-shrink: 0;
        }

        .card-description {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.6;
            font-weight: 400;
            max-width: 500px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .card-details {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            flex-shrink: 0;
        }

        .card-details ul {
            list-style: none;
            text-align: left;
            max-width: 450px;
            margin: 0 auto;
        }

        .card-details li {
            color: rgba(255, 255, 255, 0.9);
            padding: 0.35rem 0;
            font-size: 0.95rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .card-details li::before {
            content: '🌊 ';
            margin-right: 0.5rem;
        }

        @media (max-width: 768px) {
            .splash-logo {
                font-size: 3rem;
            }

            .splash-tagline {
                font-size: 0.95rem;
                letter-spacing: 2px;
            }

            .splash-dedication {
                font-size: 1.1rem;
            }

            .card-title {
                font-size: 2rem;
            }

            .card-description {
                font-size: 0.95rem;
            }

            .card {
                padding: 2rem 1.5rem;
            }

            .card-icon {
                font-size: 3rem;
            }

            .card-details li {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="card-wrapper" id="cardWrapper">
            <!-- Cards will be dynamically created -->
        </div>
    </div>

    <script>
        const cards = [
            {
                splash: true,
                title: 'Deerfield Beach',
                tagline: 'SURF\'S UP! GOOD VIBES ONLY',
                dedication: 'For Paul - Catch the wave! 🏄'
            },
            {
                icon: '🏖️',
                title: 'The Beach',
                description: 'Miles of pristine Blue Wave certified coastline with golden sand and crystal-clear Atlantic waters.',
                details: [
                    'Gentle waves perfect for swimming',
                    'Breathtaking sunrise views',
                    'ADA-accessible beach wheelchairs',
                    'Clean facilities & lifeguard stations'
                ]
            },
            {
                icon: '🎣',
                title: 'Fishing Pier',
                description: 'The iconic 720-foot International Fishing Pier extends into the Atlantic Ocean.',
                details: [
                    'Open 24/7 year-round',
                    'No fishing license required',
                    'Bait & tackle shop on-site',
                    'Catch snapper, mackerel, pompano & more'
                ]
            },
            {
                icon: '🌴',
                title: 'Quiet Waters Park',
                description: 'A 430-acre paradise featuring water sports, camping, art galleries, and nature trails.',
                details: [
                    'Cable water skiing adventures',
                    'Splash park for families',
                    'Beautiful camping areas',
                    'Art galleries & exhibitions'
                ]
            },
            {
                icon: '🤿',
                title: 'Snorkeling & Diving',
                description: 'Explore vibrant coral reefs and historic shipwrecks teeming with tropical marine life.',
                details: [
                    'Colorful tropical fish',
                    'Coral reef ecosystems',
                    'Historic shipwreck sites',
                    'Year-round diving conditions'
                ]
            },
            {
                icon: '🛒',
                title: 'Farmers Market',
                description: 'Every Saturday morning brings fresh local produce, artisan goods, and live music.',
                details: [
                    'Fresh Florida produce',
                    'Local artisan crafts',
                    'Live music performances',
                    'Community gathering spot'
                ]
            },
            {
                icon: '🍽️',
                title: 'Beachfront Dining',
                description: 'Savor fresh seafood with ocean views at casual waterfront restaurants and cafes.',
                details: [
                    'Fresh-caught seafood daily',
                    'Stunning ocean views',
                    'Casual beach atmosphere',
                    'Live music at select venues'
                ]
            },
            {
                icon: '🌅',
                title: 'Best Times',
                description: 'Year-round sunshine! Winter (Dec-Mar) offers perfect 70-80°F weather and lower humidity.',
                details: [
                    'Winter: Perfect beach weather',
                    'Spring: Fewer crowds, great deals',
                    'Summer: Beach lover\'s paradise',
                    'Fall: Pleasant temperatures return'
                ]
            },
            {
                icon: '💡',
                title: 'Insider Tips',
                description: 'Visit at sunrise for the most peaceful experience and stunning photo opportunities.',
                details: [
                    'Arrive early for best parking',
                    'Sea turtle season: March-October',
                    'Try JB\'s on the Beach',
                    'Attend annual beach festivals'
                ]
            }
        ];

        let currentIndex = 0;
        let isAnimating = false;
        let touchStartX = 0;
        let touchEndX = 0;

        const cardWrapper = document.getElementById('cardWrapper');

        // Create cards
        cards.forEach((card, index) => {
            const cardEl = document.createElement('div');
            cardEl.className = card.splash ? 'card splash' : 'card';

            if (card.splash) {
                cardEl.innerHTML = `
                    <div class="splash-logo">${card.title}</div>
                    <div class="splash-tagline">${card.tagline}</div>
                    <div class="splash-dedication">${card.dedication}</div>
                `;
            } else {
                cardEl.innerHTML = `
                    <div class="card-icon">${card.icon}</div>
                    <div class="card-title">${card.title}</div>
                    <div class="card-description">${card.description}</div>
                    ${card.details ? `
                        <div class="card-details">
                            <ul>
                                ${card.details.map(detail => `<li>${detail}</li>`).join('')}
                            </ul>
                        </div>
                    ` : ''}
                `;
            }
            cardWrapper.appendChild(cardEl);
        });

        const cardElements = document.querySelectorAll('.card');

        function updateCards() {
            cardElements.forEach((card, index) => {
                card.classList.remove('active', 'prev');
                if (index === currentIndex) {
                    card.classList.add('active');
                } else if (index < currentIndex) {
                    card.classList.add('prev');
                }
            });
        }

        function goToCard(index) {
            if (isAnimating || index === currentIndex) return;

            isAnimating = true;
            const direction = index > currentIndex ? 'right' : 'left';
            const oldCard = cardElements[currentIndex];
            const newCard = cardElements[index];

            oldCard.classList.add(direction === 'right' ? 'exiting-left' : 'exiting-right');
            newCard.classList.add(direction === 'right' ? 'entering-right' : 'entering-left');

            setTimeout(() => {
                oldCard.classList.remove('exiting-left', 'exiting-right', 'active');
                newCard.classList.remove('entering-left', 'entering-right');
                newCard.classList.add('active');
                currentIndex = index;
                updateCards();
                isAnimating = false;
            }, 600);
        }

        function nextCard() {
            const nextIndex = (currentIndex + 1) % cards.length;
            goToCard(nextIndex);
        }

        function prevCard() {
            const nextIndex = (currentIndex - 1 + cards.length) % cards.length;
            goToCard(nextIndex);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === 'ArrowRight') nextCard();
        });

        // Touch/swipe support
        cardWrapper.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        cardWrapper.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    nextCard();
                } else {
                    prevCard();
                }
            }
        }

        // Mouse drag support
        let isDragging = false;
        let dragStartX = 0;

        cardWrapper.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStartX = e.screenX;
        });

        cardWrapper.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const dragEndX = e.screenX;
            const diff = dragStartX - dragEndX;
            const swipeThreshold = 50;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    nextCard();
                } else {
                    prevCard();
                }
            }
        });

        cardWrapper.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // Initialize
        updateCards();
    </script>
</body>
</html>
